<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Tanglish → Pro Email</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Instrument+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#0d0d0d;--surface:#161616;--surface2:#1e1e1e;
    --border:#2a2a2a;--border2:#333;
    --accent:#c8f060;--accent-dim:#a8d040;
    --text:#f0ede6;--text2:#888;--text3:#444;
    --radius:10px;--radius-lg:16px;
    --font-display:'DM Serif Display',serif;
    --font-body:'Instrument Sans',sans-serif;
    --font-mono:'DM Mono',monospace;
  }
  body{background:var(--bg);color:var(--text);font-family:var(--font-body);min-height:100vh;padding:2rem 1rem 4rem}
  .wrap{max-width:660px;margin:0 auto}
  header{margin-bottom:2rem;padding-bottom:1.5rem;border-bottom:1px solid var(--border)}
  .badge{display:inline-block;font-family:var(--font-mono);font-size:11px;color:var(--accent);border:1px solid var(--accent);border-radius:100px;padding:3px 10px;margin-bottom:1rem;letter-spacing:.05em}
  h1{font-family:var(--font-display);font-size:clamp(26px,5vw,40px);font-weight:400;line-height:1.15;margin-bottom:.4rem}
  h1 span{color:var(--accent)}
  .sub{font-size:14px;color:var(--text2);line-height:1.6}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:1.25rem;margin-bottom:1rem}
  .field-lbl{font-family:var(--font-mono);font-size:11px;color:var(--text2);text-transform:uppercase;letter-spacing:.06em;margin-bottom:.6rem}
  textarea{width:100%;background:transparent;border:none;outline:none;font-family:var(--font-body);font-size:14px;color:var(--text);line-height:1.7;resize:vertical;min-height:110px}
  textarea::placeholder{color:var(--text3)}
  .btn{width:100%;padding:14px;background:var(--accent);color:#0d0d0d;border:none;border-radius:var(--radius-lg);font-family:var(--font-body);font-size:15px;font-weight:600;cursor:pointer;transition:background .2s,transform .1s}
  .btn:hover{background:var(--accent-dim)}
  .btn:active{transform:scale(.99)}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .result-sec{margin-top:1.5rem;display:none}
  .res-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  .res-lbl{font-family:var(--font-mono);font-size:11px;color:var(--accent);text-transform:uppercase;letter-spacing:.06em}
  .copy-btn{font-family:var(--font-mono);font-size:12px;padding:5px 12px;background:transparent;border:1px solid var(--border2);border-radius:100px;color:var(--text2);cursor:pointer;transition:all .2s}
  .copy-btn:hover{border-color:var(--accent);color:var(--accent)}
  .res-box{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:1.5rem;font-size:14.5px;line-height:1.8;color:var(--text);white-space:pre-wrap;word-break:break-word}
  .res-box.loading{color:var(--text3);font-style:italic;font-size:14px}
  .res-box.error{color:#f87171;font-size:14px}
  .divider{height:1px;background:var(--border);margin:1.5rem 0}
  .footer{font-size:12px;color:var(--text3);text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="badge">Free · Powered by Gemini</div>
    <h1>Tanglish → <span>Pro Email</span></h1>
    <p class="sub">Paste the email you received and your Tanglish reply — get a polished professional English email instantly.</p>
  </header>

  <div class="card">
    <div class="field-lbl">Email you received</div>
    <textarea id="received-email" placeholder="Paste the email you received here..."></textarea>
  </div>

  <div class="card">
    <div class="field-lbl">Your reply in Tanglish</div>
    <textarea id="tanglish-reply" placeholder="Ungaloda Tanglish reply inga type pannunga..." rows="4"></textarea>
  </div>

  <button class="btn" id="convert-btn" onclick="convertEmail()">Convert to Professional Email</button>

  <div class="result-sec" id="result-sec">
    <div class="divider"></div>
    <div class="res-hdr">
      <span class="res-lbl">Professional Email</span>
      <button class="copy-btn" onclick="copyResult()">Copy</button>
    </div>
    <div class="res-box" id="res-box"></div>
  </div>

  <div class="divider" style="margin-top:2rem"></div>
  <p class="footer">Free to use · No login required · Powered by Google Gemini</p>
</div>

<script>
async function convertEmail(){
  const received=document.getElementById('received-email').value.trim();
  const tanglish=document.getElementById('tanglish-reply').value.trim();
  if(!received||!tanglish){alert('Please fill in both fields.');return;}

  const btn=document.getElementById('convert-btn');
  const resultSec=document.getElementById('result-sec');
  const resBox=document.getElementById('res-box');

  btn.disabled=true;
  btn.textContent='Converting...';
  resultSec.style.display='block';
  resBox.className='res-box loading';
  resBox.textContent='Generating your professional email...';

  try{
    const response=await fetch('/api/convert',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({received,tanglish})
    });
    const data=await response.json();
    if(!response.ok) throw new Error(data.error||'Server error');
    resBox.className='res-box';
    resBox.textContent=data.result;
  }catch(err){
    resBox.className='res-box error';
    resBox.textContent='Error: '+err.message;
  }

  btn.disabled=false;
  btn.textContent='Convert to Professional Email';
}

function copyResult(){
  const text=document.getElementById('res-box').textContent;
  navigator.clipboard.writeText(text).then(()=>{
    const btn=document.querySelector('.copy-btn');
    btn.textContent='Copied!';
    setTimeout(()=>btn.textContent='Copy',2000);
  });
}
</script>
</body>
</html>
